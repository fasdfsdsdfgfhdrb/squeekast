<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squeekast overlay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23e2a874' stroke-width='3' stroke-dasharray='3 4'/></svg>">
<link rel="stylesheet" href="assets/overlay.css">
</head>
<body data-bg="0">
  <div id="stage">
    <div id="wheel-wrap">
      <canvas id="wheel" aria-label="Squeektoshi's wheel"></canvas>
      <div id="caption"><b>SQUEEKTOSHI</b> <span id="caption-state">·</span></div>
    </div>

    <div id="ticker" aria-label="Squeekchain ticker">
      <div class="cell"><span class="k">Wheel</span><span class="v" id="t-rpm">—<small>rpm</small></span></div>
      <div class="cell"><span class="k">Squeek block</span><span class="v" id="t-block">—</span></div>
      <div class="cell"><span class="k">SQK supply</span><span class="v" id="t-supply">—</span></div>
      <div class="cell"><span class="k">Squeeks</span><span class="v" id="t-nft">—</span></div>
      <div class="cell"><span class="k">Diff / 1k blocks</span><span class="v" id="t-diff">—</span></div>
      <div class="spacer"></div>
      <div class="brand"><i id="t-dot"></i>SQUEEKAST</div>
    </div>

    <div id="alert">
      <div class="box">
        <div class="k" id="a-k">New Squeek block</div>
        <div class="v" id="a-v">—</div>
        <div class="s" id="a-s">&nbsp;</div>
      </div>
    </div>
  </div>
  <script src="assets/overlay.js"></script>
</body>
</html>
